[project]
name = "personalised-multimodal-agent"
version = "0.1.0"
description = "Personalised Multimodal Agent System for recipe QA using LangGraph, CLIP, and ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "transformers>=5.0.0",
    "torch>=2.2.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_base*", "retrieval*", "agents*", "evaluation*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
